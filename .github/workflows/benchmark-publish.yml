# Publishable benchmark numbers (issue #702 lineage).
#
# Manual-only: this produces the figures that go into README.md and docs/performance/, so it is a
# deliberate act, not something that drifts in on a push.
#
# Two properties this workflow exists to guarantee, both learned the hard way:
#
#   1. Every published cell is a MEDIAN with its spread stated. A benchmark host is not a constant
#      — issue #746 published a number from a single rep that landed on a degraded runner and had
#      to be retracted. `--rep` plus the aggregation step below makes that structurally impossible.
#   2. Mountebank and WireMock are pinned and installed here, not taken from whoever ran them. The
#      comparison is only meaningful if every engine is the same version every time.
#   3. All three engines are measured in ONE dispatch at ONE warmup. A published ratio between a
#      3s-warmed Rift and a 10s-warmed JVM is not a comparison, and nothing in the table would say
#      so — hence a single `warmup` input rather than a per-leg constant.
name: Benchmark (publish)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label. Absolute numbers are machine-specific; the report records the host."
        default: "ubuntu-16core"
      reps:
        description: "Repetitions per engine (medians published, spread shown)"
        default: "3"
      duration:
        description: "oha duration per scenario point"
        default: "20s"
      connections:
        description: "Keep-alive connections for the comparison table"
        default: "50"
      warmup:
        description: >-
          Warmup per scenario point, applied to ALL THREE engines. 3s is thin for a JVM's JIT, so a
          3s rift/mb table cannot have a WireMock column bolted onto it — the whole table is
          re-measured at one warmup per dispatch.
        default: "10s"
      mb_version:
        description: "Mountebank version (pinned so the comparison is reproducible)"
        default: "2.9.1"
      wiremock_version:
        description: "WireMock version (pinned, same reason as Mountebank)"
        default: "3.9.1"
      microcks_version:
        description: "Microcks version (pinned, same reason as Mountebank)"
        default: "1.14.0"
      run_microcks:
        description: >-
          Run the Microcks leg (issue #900). Adds ~1 JVM start per imposter per rep on top of the
          scenario time, and only six of the thirteen scenarios are comparable, so it is separable
          from the 3-way table rather than welded to it.
        type: boolean
        default: true
      microcks_only:
        description: >-
          Publish ONLY the Rift-vs-Microcks table: skips Mountebank, both WireMock series and the
          Rift sweep, and has the Microcks leg run its own Rift reps. The only column that must come
          from the same dispatch is Rift (it is the ratio denominator) — WireMock's figures are
          already published and are cited rather than re-measured. Turns a ~2h dispatch into ~30min.
        type: boolean
        default: false
      run_sweep:
        description: >-
          Run the Rift-only connection sweep. It is ~75% of the wall clock and contributes nothing
          to the 3-way comparison table, so turn it off when you only want the engine comparison.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    # Dispatch inputs reach the shell as environment variables, never interpolated into the script
    # body — `${{ }}` is substituted before bash parses the line, so a crafted input would run as
    # code. `BENCH_`-prefixed because Mountebank and Rift both read `MB_*` from the environment.
    env:
      BENCH_REPS: ${{ inputs.reps }}
      BENCH_DURATION: ${{ inputs.duration }}
      BENCH_CONNECTIONS: ${{ inputs.connections }}
      BENCH_WARMUP: ${{ inputs.warmup }}
      BENCH_MB_VERSION: ${{ inputs.mb_version }}
      BENCH_WIREMOCK_VERSION: ${{ inputs.wiremock_version }}
      BENCH_MICROCKS_VERSION: ${{ inputs.microcks_version }}
      BENCH_MICROCKS_ONLY: ${{ inputs.microcks_only }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install oha, Mountebank ${{ inputs.mb_version }}, WireMock ${{ inputs.wiremock_version }}
        run: |
          set -euo pipefail
          curl -sfL -o /usr/local/bin/oha \
            https://github.com/hatoo/oha/releases/download/v1.12.0/oha-linux-amd64 \
            && chmod +x /usr/local/bin/oha && oha --version \
            || cargo install oha --locked
          npm install --prefix "$HOME/bench-mb" "mountebank@$BENCH_MB_VERSION"
          "$HOME/bench-mb/node_modules/mountebank/bin/mb" --version
          mkdir -p "$HOME/bench-wiremock"
          curl -sfL -o "$HOME/bench-wiremock/wiremock-standalone.jar" \
            "https://repo1.maven.org/maven2/org/wiremock/wiremock-standalone/$BENCH_WIREMOCK_VERSION/wiremock-standalone-$BENCH_WIREMOCK_VERSION.jar"
          # Integrity, not a version flag: a truncated jar still downloads cleanly and only fails
          # 40 minutes later inside the first rep.
          unzip -qt "$HOME/bench-wiremock/wiremock-standalone.jar"
          java -version

      # Microcks publishes only non-repackaged jars to Maven Central, so the runnable Spring Boot fat
      # jar has to be lifted out of the official image. `docker create` materialises the filesystem
      # without ever starting a container: the registry is a download source here, exactly like Maven
      # Central above, and the benchmarked process is a native JVM. That is not a detail — a
      # container's virtualised network is not a property of the engine, and measuring one would make
      # the Microcks column non-comparable with the other three.
      - name: Install Microcks ${{ inputs.microcks_version }} (native jar, no container at bench time)
        if: inputs.run_microcks
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bench-microcks"
          cid=$(docker create "microcks/microcks-uber:$BENCH_MICROCKS_VERSION")
          docker cp "$cid:/deployments/app.jar" "$HOME/bench-microcks/microcks-app.jar"
          docker rm -f "$cid"
          # Same integrity check as the WireMock jar, same reason: a truncated 138MB jar downloads
          # cleanly and only fails inside the first rep, an hour in.
          unzip -qt "$HOME/bench-microcks/microcks-app.jar"
          # Fail here, loudly, if the image ever stops shipping a Spring Boot launcher — the
          # alternative is an opaque "no main manifest attribute" at first launch.
          unzip -p "$HOME/bench-microcks/microcks-app.jar" META-INF/MANIFEST.MF \
            | grep -q 'Start-Class: io.github.microcks.MicrocksApplication'

      - name: Record environment
        run: |
          mkdir -p tests/benchmark/results
          { uname -a; nproc; lscpu | head -25; free -h; } \
            | tee tests/benchmark/results/environment.txt

      - name: Build engine
        run: cargo build --release -p rift-http-proxy

      # The comparison table. Both engines get the SAME rep count — the aggregation refuses a
      # mismatch, because a table built from unequal replication favours whichever engine got
      # more samples and nothing in the output would say so.
      - name: Rift vs Mountebank (repeated)
        if: ${{ !inputs.microcks_only }}
        working-directory: tests/benchmark
        run: |
          set -euo pipefail
          for rep in $(seq 1 "$BENCH_REPS"); do
            echo "===== comparison rep=$rep ====="
            python3 -u scripts/bench_direct.py --run-all --engines rift,mb --rep "$rep" \
              --connections "$BENCH_CONNECTIONS" --duration "$BENCH_DURATION" \
              --warmup "$BENCH_WARMUP" \
              --rift-bin ../../target/release/rift-http-proxy \
              --mb-bin "$HOME/bench-mb/node_modules/mountebank/bin/mb"
          done
          python3 -u scripts/bench_direct.py --aggregate-comparison "" \
            --connections "$BENCH_CONNECTIONS" \
            --rift-version "$(../../target/release/rift-http-proxy --version)" \
            --mb-version "$BENCH_MB_VERSION"
          # Both phases write direct_rift_repN.csv — same engine, same empty variant suffix — so
          # the sweep below would silently overwrite the comparison's inputs and the published
          # table would be built from whatever survived. Park the comparison artefacts first.
          mkdir -p results/comparison
          mv results/direct_rift_rep*.csv results/direct_mb_rep*.csv results/comparison/
          mv results/DIRECT_BENCHMARK_REPORT*.md results/comparison/ 2>/dev/null || true
          mv results/direct_rift.csv results/direct_mb.csv results/comparison/ 2>/dev/null || true
          ls results/comparison

      # The third engine. It runs here — after the comparison, before the sweep — because the 3-way
      # median table needs rift and mb at the SAME point, and the sweep below re-writes
      # direct_rift_rep*.csv at other connection counts.
      #
      # WireMock is benched by its own suite (bench_wiremock.py): it cannot consume the imposter
      # JSON, so its mappings are generated from the same fixture instead. Two series come out of
      # each rep — `wiremock` with the Jetty pool pinned (issue #865) and `wiremock-stock` at
      # out-of-the-box defaults — so the report can distinguish a thread-pool ceiling from an
      # engine ceiling.
      - name: WireMock ${{ inputs.wiremock_version }} + 3-way comparison (repeated)
        if: ${{ !inputs.microcks_only }}
        working-directory: tests/benchmark
        run: |
          set -euo pipefail
          for rep in $(seq 1 "$BENCH_REPS"); do
            echo "===== wiremock rep=$rep ====="
            python3 -u scripts/bench_wiremock.py --run-all --rep "$rep" \
              --connections "$BENCH_CONNECTIONS" --duration "$BENCH_DURATION" \
              --warmup "$BENCH_WARMUP" \
              --wiremock-jar "$HOME/bench-wiremock/wiremock-standalone.jar" \
              --wiremock-version "$BENCH_WIREMOCK_VERSION"
          done
          # Bring the parked comparison reps back so all four series aggregate together and the
          # table is one dispatch's data end to end. Unequal rep counts are refused by the
          # aggregation, so a partial copy cannot quietly become a thinner column.
          cp results/comparison/direct_rift_rep*.csv results/comparison/direct_mb_rep*.csv results/
          # No --warmup here on purpose: the report states what the reps recorded, so a mismatch
          # between what CI asked for and what ran shows up instead of being papered over.
          python3 -u scripts/bench_wiremock.py --aggregate-reps --report \
            --connections "$BENCH_CONNECTIONS" --duration "$BENCH_DURATION" \
            --rift-version "$(../../target/release/rift-http-proxy --version)" \
            --mb-version "$BENCH_MB_VERSION" \
            --wiremock-version "$BENCH_WIREMOCK_VERSION"
          # Park before the sweep: it writes direct_rift_rep*.csv and its own direct_rift_median.csv,
          # which would otherwise overwrite the inputs and the output of the table just built.
          # Named individually rather than by one broad glob: `direct_wiremock*.csv` and
          # `*_median.csv` overlap on direct_wiremock_median.csv, and `mv` given the same source
          # twice fails on the second — an hour of benching thrown away at the last command.
          mkdir -p results/wiremock
          mv results/direct_wiremock*.csv results/wiremock/
          mv results/direct_wiremock*.threads results/direct_wiremock*.warmup results/wiremock/
          mv results/WIREMOCK_BENCHMARK_REPORT*.md results/wiremock/
          # Renamed, not just moved: the sweep writes its own direct_rift_median.csv at other
          # connection counts, and two files with the same basename in one artefact is how the
          # wrong one gets published.
          mv results/direct_rift_median.csv results/wiremock/direct_rift_comparison_median.csv
          mv results/direct_mb_median.csv results/wiremock/direct_mb_comparison_median.csv
          rm -f results/direct_rift_rep*.csv results/direct_mb_rep*.csv
          ls results/wiremock

      # The fourth engine (issue #900). Runs after the WireMock leg and before the sweep, for the same
      # reason WireMock does: the table needs rift at the SAME point, and the sweep re-writes
      # direct_rift_rep*.csv at other connection counts.
      #
      # Microcks is spec-driven, so its suite generates an OpenAPI document per imposter rather than
      # stubs, and only six of the thirteen scenarios have a faithful analogue — the report lists the
      # other seven with the reason each is excluded rather than approximating them. One Microcks JVM
      # per imposter, holding only that imposter's service, so its resident corpus matches what
      # WireMock's per-imposter JVM holds.
      - name: Microcks ${{ inputs.microcks_version }} + Rift comparison (repeated)
        if: inputs.run_microcks
        working-directory: tests/benchmark
        run: |
          set -euo pipefail
          # A standalone Rift-vs-Microcks dispatch has no Mountebank/WireMock leg, so rift's reps
          # are measured here at the SAME settings — it is the ratio's denominator and must come from
          # this dispatch. WireMock's column is left empty and cited from its own published run.
          if [ "$BENCH_MICROCKS_ONLY" = "true" ]; then
            for rep in $(seq 1 "$BENCH_REPS"); do
              echo "===== rift rep=$rep (microcks_only) ====="
              python3 -u scripts/bench_direct.py --run-all --engines rift --rep "$rep" \
                --connections "$BENCH_CONNECTIONS" --duration "$BENCH_DURATION" \
                --warmup "$BENCH_WARMUP" \
                --rift-bin ../../target/release/rift-http-proxy
            done
          fi
          for rep in $(seq 1 "$BENCH_REPS"); do
            echo "===== microcks rep=$rep ====="
            python3 -u scripts/bench_microcks.py --run-all --rep "$rep" \
              --connections "$BENCH_CONNECTIONS" --duration "$BENCH_DURATION" \
              --warmup "$BENCH_WARMUP" \
              --jar "$HOME/bench-microcks/microcks-app.jar" \
              --microcks-version "$BENCH_MICROCKS_VERSION"
          done
          # `--aggregate` collapses every series present, including rift's when its reps are here,
          # so a standalone dispatch needs nothing from the WireMock leg.
          python3 -u scripts/bench_microcks.py --aggregate
          if [ "$BENCH_MICROCKS_ONLY" != "true" ]; then
            # The full dispatch parked rift's and WireMock's medians in the WireMock leg. Copy them
            # back under the plain names --report reads, rather than teaching the report about CI's
            # directory layout.
            cp results/wiremock/direct_rift_comparison_median.csv results/direct_rift_median.csv
            cp results/wiremock/direct_wiremock_median.csv results/direct_wiremock_median.csv
          fi
          # No --warmup here on purpose: the report states what the reps recorded, so a mismatch
          # between what CI asked for and what ran shows up instead of being papered over.
          python3 -u scripts/bench_microcks.py --report --csv-suffix _median \
            --connections "$BENCH_CONNECTIONS" --duration "$BENCH_DURATION"
          mkdir -p results/microcks
          # `direct_microcks*` also matches the `microcks-stock` secondary series, which is intended.
          mv results/direct_microcks*.csv results/microcks/
          mv results/direct_microcks*.warmup results/direct_microcks*.threads results/microcks/
          mv results/direct_microcks*.heap results/direct_microcks*.version results/microcks/
          mv results/MICROCKS_BENCHMARK_REPORT.md results/microcks/
          # Rift's median is this table's denominator, so it belongs beside it in the artefact when
          # this leg produced it. In the full dispatch it was only borrowed, and the sweep writes its
          # own direct_rift_median.csv — two files with that basename in one artefact is how the
          # wrong one gets published.
          if [ "$BENCH_MICROCKS_ONLY" = "true" ]; then
            mv results/direct_rift_median.csv results/microcks/
            mv results/direct_rift_rep*.csv results/microcks/ 2>/dev/null || true
          else
            rm -f results/direct_rift_median.csv results/direct_wiremock_median.csv
          fi
          ls results/microcks

      # Rift-only sweep: connection scaling plus the matching-dimension scenarios that the
      # comparison set deliberately excludes (it is a stability contract).
      - name: Rift concurrency sweep + matching dimensions (repeated)
        if: ${{ inputs.run_sweep && !inputs.microcks_only }}
        working-directory: tests/benchmark
        run: |
          set -euo pipefail
          for rep in $(seq 1 "$BENCH_REPS"); do
            echo "===== sweep rep=$rep ====="
            python3 -u scripts/bench_direct.py --run-all --rep "$rep" \
              --sweep-connections 1,50,256,512 --duration "$BENCH_DURATION" \
              --warmup "$BENCH_WARMUP" \
              --rift-bin ../../target/release/rift-http-proxy
          done
          python3 -u scripts/bench_direct.py --aggregate-reps ""

      - name: Diagnostics on failure
        if: failure()
        run: |
          free -m; df -h / | tail -1
          # results/logs/ as well as results/: the WireMock leg spawns 14 JVMs and writes each one's
          # log there, and it is the leg most likely to die on a readiness probe or an OOM.
          tail -40 tests/benchmark/results/*.log tests/benchmark/results/logs/*.log 2>/dev/null \
            || echo "(no logs)"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-publish-results
          path: |
            tests/benchmark/results/*.csv
            tests/benchmark/results/*.md
            tests/benchmark/results/comparison/*
            tests/benchmark/results/wiremock/*
            tests/benchmark/results/microcks/*
            tests/benchmark/results/environment.txt
            tests/benchmark/results/*.log
            tests/benchmark/results/logs/*.log
          retention-days: 90
