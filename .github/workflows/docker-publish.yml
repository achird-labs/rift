            tar --wildcards -xzf - -C binaries/amd64 --strip-components=2 "*/bin/rift-lint"
          chmod +x binaries/amd64/rift-lint

      - name: Download linux-arm64 binary
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p binaries/arm64
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${VERSION}/rift-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" | \
            tar --wildcards -xzf - -C binaries/arm64 --strip-components=2 "*/bin/rift-lint"
          chmod +x binaries/arm64/rift-lint

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push amd64 image
      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: ./binaries/amd64
          file: ./crates/rift-lint/Dockerfile.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/rift-lint:${{ steps.vars.outputs.VERSION }}-amd64
          build-args: |
            VERSION=${{ steps.vars.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          # Attestations (issue #664): enterprise image-curation pipelines verify these, and an
          # unattested image is what gets rejected at their gate.
          sbom: true
          provenance: mode=max

      # Build and push arm64 image
      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: ./binaries/arm64
          file: ./crates/rift-lint/Dockerfile.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/rift-lint:${{ steps.vars.outputs.VERSION }}-arm64
          build-args: |
            VERSION=${{ steps.vars.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          # Attestations (issue #664): enterprise image-curation pipelines verify these, and an
          # unattested image is what gets rejected at their gate.
          sbom: true
          provenance: mode=max

      # Create and push multi-arch manifest
      - name: Create and push manifest
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/rift-lint"

          docker buildx imagetools create -t ${{ env.REGISTRY }}/${REPO}:${VERSION} \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY }}/${REPO}:latest \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-arm64

