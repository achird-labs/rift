              --format '{{println .Manifest.Digest}}'
          done | sort -u)

          [ -n "$DIGESTS" ] || { echo "::error::resolved no digests to sign for ${REPO}"; exit 1; }

          echo "$DIGESTS" | while read -r DIGEST; do
