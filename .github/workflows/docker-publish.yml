name: Build and Publish Docker Images

on:
  # Note: intentionally NOT triggered by `push: tags`. This workflow downloads
  # the release binaries from the GitHub Release, which do not exist at tag-push
  # time. It is invoked by release.yml (workflow_call) after the release job has
  # uploaded the assets, or manually via workflow_dispatch.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for Docker images (e.g., v0.1.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to use for Docker images (e.g., v0.1.0)'
        required: true
        type: string

env:
  REGISTRY: docker.io

jobs:
  # =============================================================================
  # Build and push rift-proxy using pre-built binaries from release
  # This is much faster than compiling in Docker (~2 min vs ~1.5 hours)
  # =============================================================================
  build-rift-proxy:
    name: Build rift-proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign keyless signing exchanges this OIDC token for a short-lived Fulcio cert (issue #664).
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: vars
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="edge"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      # Download pre-built binaries from GitHub Release
      - name: Download linux-amd64 binary
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p binaries/amd64
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${VERSION}/rift-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | \
            tar --wildcards -xzf - -C binaries/amd64 --strip-components=2 "*/bin/rift"
          mv binaries/amd64/rift binaries/amd64/rift-http-proxy
          chmod +x binaries/amd64/rift-http-proxy

      - name: Download linux-arm64 binary
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p binaries/arm64
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${VERSION}/rift-${VERSION}-aarch64-unknown-linux-gnu.tar.gz" | \
            tar --wildcards -xzf - -C binaries/arm64 --strip-components=2 "*/bin/rift"
          mv binaries/arm64/rift binaries/arm64/rift-http-proxy
          chmod +x binaries/arm64/rift-http-proxy

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push amd64 image
      - name: Build and push amd64
        uses: docker/build-push-action@v7
        with:
          context: ./binaries/amd64
          file: ./crates/rift-http-proxy/Dockerfile.prebuilt
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy:${{ steps.vars.outputs.VERSION }}-amd64
          build-args: |
            VERSION=${{ steps.vars.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          # Attestations (issue #664): enterprise image-curation pipelines verify these, and an
          # unattested image is what gets rejected at their gate.
          sbom: true
          provenance: mode=max

      # Build and push arm64 image
      - name: Build and push arm64
        uses: docker/build-push-action@v7
        with:
          context: ./binaries/arm64
          file: ./crates/rift-http-proxy/Dockerfile.prebuilt
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy:${{ steps.vars.outputs.VERSION }}-arm64
          build-args: |
            VERSION=${{ steps.vars.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          # Attestations (issue #664): enterprise image-curation pipelines verify these, and an
          # unattested image is what gets rejected at their gate.
          sbom: true
          provenance: mode=max

      # Create and push multi-arch manifest
      - name: Create and push manifest
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy"

          # Create manifest for version tag
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${REPO}:${VERSION} \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-arm64

          # Create manifest for latest tag
          docker buildx imagetools create -t ${{ env.REGISTRY }}/${REPO}:latest \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-amd64 \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Sign the multi-arch index each tag actually resolves to — that digest is what a consumer
      # pulls and what `cosign verify` checks. Keyless: the identity is this workflow, not a key
      # anyone has to hold. Tags are deduped because :VERSION and :latest are the same index.
      - name: Sign published images
        run: |
          # pipefail matters here: without it a failing `imagetools inspect` yields an empty digest
          # list, the loop signs nothing, and the step still exits 0 — a publish that reports
          # success having signed nothing. The signed-count assertion is the backstop.
          # `{{println}}` (not bare `{{.Manifest.Digest}}`) matters just as much: `--format` emits no
          # trailing newline, so two tags resolving to the same digest concatenated into one
          # `sha256:X...sha256:X...` line that `sort -u` could not dedupe and cosign could not parse.
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.VERSION }}"
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy"

          DIGESTS=$(for TAG in "${VERSION}" latest; do
            docker buildx imagetools inspect "${{ env.REGISTRY }}/${REPO}:${TAG}" \
              --format '{{println .Manifest.Digest}}'
          done | sort -u)

          [ -n "$DIGESTS" ] || { echo "::error::resolved no digests to sign for ${REPO}"; exit 1; }

          echo "$DIGESTS" | while read -r DIGEST; do
            echo "signing ${REPO}@${DIGEST}"
            cosign sign --yes "${{ env.REGISTRY }}/${REPO}@${DIGEST}"
          done

          # Prove the attestations survived `imagetools create`: buildx attaches SBOM/provenance as
          # separate manifests in each per-arch index, and this job merges those indexes into a new
          # one. If that merge ever drops them, fail here rather than publish an image that claims
          # attestations it does not carry.
          echo "$DIGESTS" | while read -r DIGEST; do
            REF="${{ env.REGISTRY }}/${REPO}@${DIGEST}"
            for KIND in SBOM Provenance; do
              OUT=$(docker buildx imagetools inspect "$REF" --format "{{ json .${KIND} }}")
              case "$OUT" in
                ''|null|'{}') echo "::error::${REF} carries no ${KIND}"; exit 1 ;;
                *) echo "  ${KIND} present on ${REF}" ;;
              esac
            done
          done

  # =============================================================================
  # Plane A conformance against the image just published (issue #1350, #1467's container leg).
  #
  # The pull-request leg (conformance.yml) runs container mode against an image it builds itself
  # from the PR's binary; this one runs the same Rust runner against the image a user pulls, so a
  # packaging fault in the published image (its Dockerfile, its entrypoint, the multi-arch index)
  # fails here. It never runs on a pull request: this workflow is only called by release.yml and by
  # hand. The tools (rift-lint, rift-verify) and the runner come from the release tag, the engine
  # from the image.
  # =============================================================================
  conformance-container:
    name: Plane A conformance (published image)
    needs: build-rift-proxy
    # 22.04, as release.yml builds the linux-gnu binaries this job stages for the tools.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RIFT_MAX_BODY_SIZE: "10485760"
      RIFT_CONFORMANCE_REQUIRE: "1"
      RIFT_MODE: container
    steps:
      - name: Determine version
        id: vars
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="edge"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      # The runner and the specification of exactly this release.
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      # The released binaries, staged with the BUILD_INFO feature 01 checks them against, as the
      # pull-request leg stages its own build.
      - name: Stage the released binaries and BUILD_INFO
        run: |
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.VERSION }}"
          dir="$RUNNER_TEMP/rift-build"
          mkdir -p "$dir"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${VERSION}/rift-${VERSION}-x86_64-unknown-linux-gnu.tar.gz" | \
            tar --wildcards -xzf - -C "$dir" --strip-components=2 "*/bin/rift" "*/bin/rift-lint" "*/bin/rift-verify"
          binaries='{}'
          versions='{}'
          for name in rift rift-lint rift-verify; do
            sha="$(sha256sum "$dir/$name" | cut -d' ' -f1)"
            ver="$("$dir/$name" --version | head -1)"
            binaries="$(jq --arg n "$name" --arg s "$sha" '. + {($n): $s}' <<<"$binaries")"
            versions="$(jq --arg n "$name" --arg v "$ver" '. + {($n): $v}' <<<"$versions")"
          done
          jq -n --arg commit "$(git rev-parse HEAD)" --arg branch "$VERSION" \
            --arg builtAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson binaries "$binaries" --argjson versions "$versions" \
            '{commit: $commit, branch: $branch, builtAt: $builtAt, binaries: $binaries, versions: $versions}' \
            > "$dir/BUILD_INFO"
          cat "$dir/BUILD_INFO"
          echo "RIFT_BUILD_DIR=$dir" >> "$GITHUB_ENV"

      # Pulled before the run, so a missing or unpublished image fails here rather than as a
      # harness start-up error.
      - name: Pull the published image
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy:${{ steps.vars.outputs.VERSION }}"
          docker pull "$IMAGE"
          echo "RIFT_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run the Plane A features (container mode)
        run: cargo test -p rift-conformance-runner --test plane_a

  # =============================================================================
  # Build and push the static (scratch) rift-proxy flavor — issue #664.
  #
  # Uses the musl release binaries, which release.yml already builds with `cross`. They are
  # genuinely static (rift's TLS is pure rustls/ring, no OpenSSL), so the image can be FROM
  # scratch: no OS packages, nothing for a scanner to flag, nothing to patch.
  # Published as `-static` tags alongside the Debian-based default.
  # =============================================================================
  build-rift-proxy-static:
    name: Build rift-proxy (static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign keyless signing exchanges this OIDC token for a short-lived Fulcio cert (issue #664).
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine version
        id: vars
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="edge"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_OUTPUT

      # Pre-built musl binaries from the GitHub Release (release.yml build matrix).
      - name: Download linux-amd64 musl binary
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p binaries/amd64-musl
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${VERSION}/rift-${VERSION}-x86_64-unknown-linux-musl.tar.gz" | \
            tar --wildcards -xzf - -C binaries/amd64-musl --strip-components=2 "*/bin/rift"
          mv binaries/amd64-musl/rift binaries/amd64-musl/rift-http-proxy
          chmod +x binaries/amd64-musl/rift-http-proxy

      - name: Download linux-arm64 musl binary
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          mkdir -p binaries/arm64-musl
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${VERSION}/rift-${VERSION}-aarch64-unknown-linux-musl.tar.gz" | \
            tar --wildcards -xzf - -C binaries/arm64-musl --strip-components=2 "*/bin/rift"
          mv binaries/arm64-musl/rift binaries/arm64-musl/rift-http-proxy
          chmod +x binaries/arm64-musl/rift-http-proxy

      # The binary is static, but the image is still built per-platform so the manifest advertises
      # the right architecture to a puller.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push amd64 (static)
        uses: docker/build-push-action@v7
        with:
          context: ./binaries/amd64-musl
          file: ./crates/rift-http-proxy/Dockerfile.static
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy:${{ steps.vars.outputs.VERSION }}-static-amd64
          build-args: |
            VERSION=${{ steps.vars.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          sbom: true
          provenance: mode=max

      - name: Build and push arm64 (static)
        uses: docker/build-push-action@v7
        with:
          context: ./binaries/arm64-musl
          file: ./crates/rift-http-proxy/Dockerfile.static
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy:${{ steps.vars.outputs.VERSION }}-static-arm64
          build-args: |
            VERSION=${{ steps.vars.outputs.VERSION }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
          sbom: true
          provenance: mode=max

      - name: Create and push static manifest
        run: |
          VERSION="${{ steps.vars.outputs.VERSION }}"
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy"

          docker buildx imagetools create -t ${{ env.REGISTRY }}/${REPO}:${VERSION}-static \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-static-amd64 \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-static-arm64

          docker buildx imagetools create -t ${{ env.REGISTRY }}/${REPO}:latest-static \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-static-amd64 \
            ${{ env.REGISTRY }}/${REPO}:${VERSION}-static-arm64

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign published static images
        run: |
          # pipefail matters here: without it a failing `imagetools inspect` yields an empty digest
          # list, the loop signs nothing, and the step still exits 0 — a publish that reports
          # success having signed nothing. The signed-count assertion is the backstop.
          # `{{println}}` (not bare `{{.Manifest.Digest}}`) matters just as much: `--format` emits no
          # trailing newline, so two tags resolving to the same digest concatenated into one
          # `sha256:X...sha256:X...` line that `sort -u` could not dedupe and cosign could not parse.
          set -euo pipefail
          VERSION="${{ steps.vars.outputs.VERSION }}"
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/rift-proxy"

          DIGESTS=$(for TAG in "${VERSION}-static" latest-static; do
            docker buildx imagetools inspect "${{ env.REGISTRY }}/${REPO}:${TAG}" \
              --format '{{println .Manifest.Digest}}'
          done | sort -u)

          [ -n "$DIGESTS" ] || { echo "::error::resolved no digests to sign for ${REPO}"; exit 1; }

          echo "$DIGESTS" | while read -r DIGEST; do
            echo "signing ${REPO}@${DIGEST}"
            cosign sign --yes "${{ env.REGISTRY }}/${REPO}@${DIGEST}"
          done

          # Prove the attestations survived `imagetools create`: buildx attaches SBOM/provenance as
          # separate manifests in each per-arch index, and this job merges those indexes into a new
          # one. If that merge ever drops them, fail here rather than publish an image that claims
          # attestations it does not carry.
          echo "$DIGESTS" | while read -r DIGEST; do
            REF="${{ env.REGISTRY }}/${REPO}@${DIGEST}"
            for KIND in SBOM Provenance; do
              OUT=$(docker buildx imagetools inspect "$REF" --format "{{ json .${KIND} }}")
              case "$OUT" in
                ''|null|'{}') echo "::error::${REF} carries no ${KIND}"; exit 1 ;;
                *) echo "  ${KIND} present on ${REF}" ;;
              esac
            done
          done

  # =============================================================================
  # Build and push rift-lint using pre-built binaries from release
  # =============================================================================
  build-rift-lint:
    name: Build rift-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # cosign keyless signing exchanges this OIDC token for a short-lived Fulcio cert (issue #664).
      id-token: write

    steps:
