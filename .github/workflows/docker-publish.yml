          set -euo pipefail
          VERSION="${{ steps.vars.outputs.VERSION }}"
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/rift-lint"

          DIGESTS=$(for TAG in "${VERSION}" latest; do
