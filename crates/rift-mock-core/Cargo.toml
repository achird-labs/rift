[package]
name = "rift-mock-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

description = "Rift core engine: imposter lifecycle, matching, behaviors, scripting and flow-state — usable in-process without the CLI or admin server."
readme = "README.md"

[lints]
workspace = true

[dependencies]
# Fast, non-cryptographic hashing for the request path (issue #654): `util::FastMap`/`FastSet`,
# the predicate regex cache, and the JSON body index. Already in the tree via hashbrown; a direct
# dep costs nothing. None of these hashes leaves the process, so none needs cross-process
# stability — see `util`'s module docs for the seeding rules each one relies on.
foldhash = "0.2"
# Async runtime
tokio = { workspace = true, features = ["full"] }
# TaskTracker for bounded connection-drain on imposter teardown (issue #596)
tokio-util = { workspace = true, features = ["rt"] }

# HTTP
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.0"
# Reads the OS trust store for the shared outbound-TLS policy (issue #974). Already a direct
# dependency; #975 removed `proxy/client.rs`, this crate's only hyper-rustls consumer, so it is no
# longer *also* reachable transitively — which is why hyper-rustls itself is gone from this list.
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# x509-parser: needed to recover a loaded CA's distinguished name and SKI (Issuer::from_ca_cert_pem)
rcgen = { version = "0.14", features = ["x509-parser"] }
# Issue #1274: a CA meant to be kept gets a validity window from now (rcgen takes `time` types),
# and a PEM bundle's certificates are named by their subject CN in an exported truststore. Both
# crates are already in the tree through rcgen.
time = "0.3"
x509-parser = "0.18"
# Bounded LRU cache for per-SNI intercept leaves (issue #539 — MITM-intercept DoS)
lru = "0.18"

# Serialization
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true

# Shared workspace types
rift-types = { path = "../rift-types", version = "0.1.0" }

# Scripting engines
rhai.workspace = true
boa_engine = { version = "0.20", optional = true }

# Logging & Observability
tracing.workspace = true
prometheus = "0.14"

# HTTP client (proxy forwarding)
reqwest.workspace = true

# Utils
bytes.workspace = true
base64 = "0.23"
chrono.workspace = true
regex = "1.11"
# The multi-pattern engine behind `regex` (issue #709). Already in the tree transitively via
# `regex`; naming it directly keeps one automata stack rather than a second, so the version must
# stay compatible with `regex` above.
regex-automata = "0.4"
# The multi-pattern literal engine behind `regex`'s own prefilter (issue #710). Already in the
# tree transitively via `regex`; naming it directly keeps one automata stack rather than a second.
aho-corasick = "1.1"
# Automaton-based JSON body-field matching (issue #767); default-on, droppable for
# minimal/FFI builds via `--no-default-features`.
quamina = { version = "0.7", optional = true }
memchr.workspace = true
rand.workspace = true
urlencoding = "2.1"
anyhow.workspace = true
thiserror.workspace = true
socket2 = "0.6"
num_cpus = "1.16"
libc = "0.2"
parking_lot = "0.12"
arc-swap = "1.7"
crossbeam = "0.8"
# Response templating `{{uuid}}` (issue #359); already a workspace dep (previously dev-only here).
uuid.workspace = true

# XML/XPath support
sxd-document = "0.3"
sxd-xpath = "0.4"

# JSONPath RFC 9535 support
serde_json_path = "0.7"
p12 = "0.6.3"
# Pinned to p12's major: the PKCS#12 attribute and writer types we build (`ObjectIdentifier`,
# `DERWriter`) must be the exact ones p12 0.6.3 (its last release) exposes, and it requires ^0.5.
yasna = "0.5"
ring = "0.17"
# Lock-free concurrent HashMap for the predicate regex cache (issue #715): reads on the imposter
# matching hot path proceed without contending a lock.
papaya = "0.2.4"

[dev-dependencies]
tempfile = "3.8"
# Renders the shipped templates exactly as the config loader does (tests/shipped_templates_load.rs).
rift-ejs = { path = "../rift-ejs", version = "0.1.0" }
reqwest.workspace = true
tokio-test = "0.4"
tracing-test = "0.2"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "imposter_matcher_bench"
harness = false

[[bench]]
name = "response_serve_bench"
harness = false

[[bench]]
name = "apply_config_bench"
harness = false

[features]
default = ["javascript", "quamina-matching"]
# NOTE: there is deliberately no `redis-backend` feature here any more (issue #853). The Redis flow
# store lives in the `rift-store-redis` crate and attaches through `FlowStoreBackendFactory`, so
# this crate cannot pull `redis`/`r2d2` under any feature combination. The feature name survives on
# `rift-http-proxy` and `rift-ffi`, where it now means "register the redis backend".
javascript = ["boa_engine"]
# Quamina-backed body-field candidate dimension (issue #767). Off ⇒ the dimension
# compiles to a no-op that never prunes; Stage-2 still evaluates every body predicate.
quamina-matching = ["dep:quamina"]
# Deliberately failing flow-store backend for backend-outage tests (issue #318)
test-backend = []
