[package]
name = "rift-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

description = "Configuration linter library and CLI for Rift imposter files"
readme = "README.md"
keywords = ["lint", "validation", "http", "mock", "mountebank"]
categories = ["development-tools::testing", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
base64 = "0.23"
# Serialization
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true

# Regex for pattern validation
regex = "1"
rift-ejs = { path = "../rift-ejs", version = "0.1.0" }
# The predicate grammar's names — operators, parameters, generator keys — come from the crate the
# engine reads them from (issue #1342), so the linter cannot drift from it.
rift-types = { path = "../rift-types", version = "0.1.0" }
# `rift-lint schema` (issue #1342): the engine crate generates the schema from its own types.
# Optional and off by default: the linter binary must not carry the engine.
rift-mock-core = { path = "../rift-mock-core", version = "0.1.0", default-features = false, features = ["schema"], optional = true }

# Structured error types
thiserror.workspace = true

# CLI argument parsing (only needed for binary)
clap = { workspace = true, optional = true }

# JavaScript validation (optional) — aligned with rift-mock-core's boa_engine pin
boa_engine = { version = "0.22", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# `javascript` is default-on (issue #1156): without it E040 has no fallback at all, and every
# released binary, image and brew install was built with the defaults — so a JS `_rift.script`
# got no syntax check whatsoever. `rift-tui` depends with `default-features = false`, so it does
# not grow.
default = ["cli", "javascript"]
cli = ["dep:clap"]
javascript = ["dep:boa_engine"]
# The `schema` subcommand, which emits the imposter JSON Schema (issue #1342). Needs the engine
# crate, so it is off by default and off in the released binary; the generated file ships in
# `sdk-conformance/schema/` instead.
schema = ["dep:rift-mock-core"]

[[bin]]
name = "rift-lint"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rift_lint"
path = "src/lib.rs"
