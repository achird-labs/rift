[package]
name = "rift-lint"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

description = "Configuration linter library and CLI for Rift imposter files"
readme = "README.md"
keywords = ["lint", "validation", "http", "mock", "mountebank"]
categories = ["development-tools::testing", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
base64 = "0.22"
# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Regex for pattern validation
regex = "1"
rift-ejs = { path = "../rift-ejs", version = "0.1.0" }

# Structured error types
thiserror.workspace = true

# CLI argument parsing (only needed for binary)
clap = { workspace = true, optional = true }

# JavaScript validation (optional) — aligned with rift-mock-core's boa_engine pin
boa_engine = { version = "0.20", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# `javascript` is default-on (issue #1156): without it E040 has no fallback at all, and every
# released binary, image and brew install was built with the defaults — so a JS `_rift.script`
# got no syntax check whatsoever. `rift-tui` depends with `default-features = false`, so it does
# not grow.
default = ["cli", "javascript"]
cli = ["dep:clap"]
javascript = ["dep:boa_engine"]

[[bin]]
name = "rift-lint"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "rift_lint"
path = "src/lib.rs"
