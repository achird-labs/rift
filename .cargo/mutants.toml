# cargo-mutants configuration (issue #1345). Used only by .github/workflows/mutants.yml and by a
# manual `cargo mutants`; it does not affect build or test.

# Never mutate test code: a "surviving" mutant in a test helper is noise, not a test gap.
exclude_globs = [
    "**/tests/**",
    "**/tests.rs",
    "**/*_tests.rs",
    "**/benches/**",
    "**/build.rs",
]

# Skip mutants inside logging calls; changing a log line is not an observable behaviour.
exclude_re = [
    "tracing::",
    # `Debug` output is for humans; a mutant that blanks it is not a behaviour change.
    "<impl (fmt::|std::fmt::|core::fmt::)?Debug for ",
    # Equivalent mutant: `join` ORs a value shifted left 32 bits with a `u32`, so the bits never
    # overlap and `^` computes the same number as `|`.
    "behaviors/cycler.rs:.*replace \\| with \\^ in join",
    # Equivalent: `mix64`/`combine` only feed the in-process body-hash index (#708), which
    # over-approximates. Any deterministic mix keeps equal bodies hash-equal, and a changed collision
    # set only widens the Stage-1 candidates that Stage 2 re-checks. Never persisted or exposed. The
    # constant-return and `combine` `^`→`&` mutants degrade pruning visibly and are caught: keep them.
    "predicates/json.rs:.*replace (\\^=|>>) with .* in mix64$",
    "predicates/json.rs:.*replace \\^ with \\| in combine$",
    # Equivalent: papaya's `Default` for `HashMap<K, V, S>` is `with_hasher(S::default())`, the body verbatim.
    "predicates/regex_cache.rs:.*replace new_cache_map -> CacheMap with Default::default\\(\\)",
    # Equivalent: each `visit_unit` returns `Ok(Vec::new())`, which is `Vec::default()`.
    "behaviors/types.rs:.*::visit_unit -> Result<Self::Value, E> with Ok\\(Default::default\\(\\)\\)",
    # Equivalent (#1383): an empty carried range (`start == stop`) always ends where the range
    # pushed just before it ends, so `push_merged` absorbs it.
    "behaviors/spliced.rs:.*replace < with <= in Rebuild::copy_untouched",
    # Equivalent (#1383): breaking on `r.end == segment.end` only defers advancing past that range
    # by one call; the next call pushes nothing for it and then advances.
    "behaviors/spliced.rs:.*replace > with >= in Rebuild::copy_untouched",
]
