# cargo-mutants configuration (issue #1345). Used only by .github/workflows/mutants.yml and by a
# manual `cargo mutants`; it does not affect build or test.

# Never mutate test code: a "surviving" mutant in a test helper is noise, not a test gap.
exclude_globs = [
    "**/tests/**",
    "**/tests.rs",
    "**/*_tests.rs",
    "**/benches/**",
    "**/build.rs",
]

# Skip mutants inside logging calls; changing a log line is not an observable behaviour.
exclude_re = [
    "tracing::",
    # `Debug` output is for humans; a mutant that blanks it is not a behaviour change.
    "<impl (fmt::|std::fmt::|core::fmt::)?Debug for ",
    # Equivalent mutant: `join` ORs a value shifted left 32 bits with a `u32`, so the bits never
    # overlap and `^` computes the same number as `|`.
    "behaviors/cycler.rs:.*replace \\| with \\^ in join",
]
