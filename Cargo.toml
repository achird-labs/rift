[workspace]
resolver = "2"
members = [
    "crates/rift-types",
    "crates/rift-ejs",
    "crates/rift-mock-core",
    "crates/rift-ffi",
    "crates/rift-http-proxy",
    "crates/rift-lint",
    "crates/rift-tui",
    "conformance/differential",
]
exclude = [
    "examples/apps/*",
    "benchmarks/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Rift Contributors"]
repository = "https://github.com/achird-labs/rift"
homepage = "https://github.com/achird-labs/rift"
rust-version = "1.99"

# Centralized lint policy inherited by every crate via `[lints] workspace = true`.
# Kept intentionally conservative: CI runs `clippy -- -D warnings`, which promotes any
# `warn` to a hard error, so stricter lints (e.g. clippy::unwrap_used / expect_used) are
# deliberately left out here — enabling them would fail the build on ~650 pre-existing
# sites. This table centralizes the existing policy and makes new crates inherit it.
[workspace.lints.clippy]
all = "warn"
# Targeted idiom lints (not full pedantic): keep new code on modern idioms.
uninlined_format_args = "warn"
manual_let_else = "warn"
unnecessary_map_or = "warn"
# Clean today, so free to hold: `a + b / 2`-style midpoints overflow (use `midpoint`, stable since
# 1.85/1.87), an `#[ignore]` must say why (`#[ignore = "..."]`), and `.cloned()` on `Copy` items
# hides that nothing is cloned.
manual_midpoint = "warn"
ignore_without_reason = "warn"
cloned_instead_of_copied = "warn"

[workspace.lints.rust]
# A lifetime that is provably equal to another (`'a: 'b, 'b: 'a`) is noise; clean today.
redundant_lifetimes = "warn"

[workspace.dependencies]
# Async runtime — version pinned here; each crate selects its own tokio features.
# 1.50: `TcpStream::set_zero_linger` (fault_io RST injection; `set_linger` is deprecated).
tokio = { version = "1.50" }
tokio-util = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: without it serde_json's float parse is not correctly rounded, so a literal can
# come back one double away and be served with different digits — `7e23` as `6.999999999999999e23`
# (issue #1085). Costs ~2x on float parsing only. Pinned by rift-types'
# `serde_json_parses_floats_correctly_rounded`. `arbitrary_precision` and `preserve_order` stay off.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde_norway = "0.9"

# Scripting — pinned to =1.21.0 to match rift-mock-core's deliberate exact pin
rhai = { version = "=1.21.0", features = ["sync", "serde"] }

# CLI — base features; crates add `env` where needed
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

# HTTP client — rustls everywhere (the project pins the ring crypto provider).
# reqwest 0.13 has no ring-backed TLS feature: `rustls` means aws-lc-rs (whose C build fails on
# the windows-msvc release runner) plus `rustls-platform-verifier`. `rustls-no-provider` keeps
# ring: reqwest then uses the process-default provider, which every Rift entry point installs.
# Trust is unchanged from 0.12's `rustls-tls-native-roots` (issue #974): imposter traffic builds
# its clients from `OutboundTls` (OS store + `--upstream-ca-file`), and the CLI clients from
# `rift_http_proxy::http_client_builder` (OS store via webpki). Defaults stay off as before: no
# `http2`, `charset` or `system-proxy` (HTTP(S)_PROXY / NO_PROXY env vars are still honoured).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging. `release_max_level_debug` compiles `trace!` out of release builds entirely (issue #706),
# so per-request `trace!` sites cost nothing in production — not even the cached-interest atomic load.
tracing = { version = "0.1", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Misc utilities
futures = "0.3"
bytes = "1.7"
# SIMD substring search for fixed literals probed per request (issue #706).
memchr = "2.7"
uuid = { version = "1.8", features = ["v4", "serde"] }
rand = "0.10"

# Testing
proptest = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
incremental = false  # For reproducible benchmarks

[profile.dev]
opt-level = 0
debug = true

# Issue #1021: std's panic hook symbolises the whole backtrace while holding a process-global
# lock, so the DWARF a test binary carries is paid for by every other thread that touches that
# lock — including every `anyhow::Error` construction. Line tables keep panic backtraces
# readable (file:line survives; only variable/type info goes) at a fraction of the debug info.
[profile.test]
debug = "line-tables-only"
