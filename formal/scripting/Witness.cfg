\* Every documented failure on: a refused save, a panicking job, and a getter on the answer. What must hold regardless holds here; witness.py asks for what must not, and coverage is read from this cfg.
SPECIFICATION Spec
CONSTANTS
    Runs = {r1, r2}
    r1 = r1
    r2 = r2
    Workers = {w1, w2}
    Accesses = {a1, a2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxJobs = 1
    MaxRestarts = 1
    MaxAccessChanges = 1
    Sequels = FALSE
    GetterWrites = TRUE
    SaveFails = TRUE
    Panics = TRUE
SYMMETRY WorkerSymmetry
INVARIANTS
    TypeInv
    NeverTwoWorkersOneKey
    ClaimsAgree
    OneLiveStatePerKey
    OldRunSavesToOldCell
    EndedRunsLeaveNothing
