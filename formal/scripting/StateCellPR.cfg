\* The PR gate: two runs, two workers, two accesses, a restart and an access change.  Findings are in Known.cfg.
SPECIFICATION Spec
CONSTANTS
    Runs = {r1, r2}
    r1 = r1
    r2 = r2
    Workers = {w1, w2}
    Accesses = {a1, a2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxJobs = 1
    MaxRestarts = 1
    MaxAccessChanges = 1
    Sequels = FALSE
    GetterWrites = TRUE
    SaveFails = FALSE
    Panics = FALSE
SYMMETRY WorkerSymmetry
INVARIANTS
    TypeInv
    HeirFailsOnlyByItsOwnJob
    NeverTwoWorkersOneKey
    ClaimsAgree
    OneLiveStatePerKey
    OldRunSavesToOldCell
    CellCurrentBeforeAnswer
    NoLostUpdate
    EndedRunsLeaveNothing
