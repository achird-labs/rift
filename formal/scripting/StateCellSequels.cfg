\* The PR bounds with r2 a later hook of r1's request, so the two are never concurrent: heirs and the
\* shared live state are the PR cfg's, and a request keeping one cell is this one's (#1784).
SPECIFICATION Spec
CONSTANTS
    Runs = {r1, r2}
    r1 = r1
    r2 = r2
    Workers = {w1, w2}
    Accesses = {a1, a2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxJobs = 1
    MaxRestarts = 1
    MaxAccessChanges = 1
    Sequels = TRUE
    GetterWrites = TRUE
    SaveFails = FALSE
    Panics = FALSE
SYMMETRY WorkerSymmetry
INVARIANTS
    RequestKeepsOneCell
    TypeInv
    HeirFailsOnlyByItsOwnJob
    NeverTwoWorkersOneKey
    ClaimsAgree
    OneLiveStatePerKey
    OldRunSavesToOldCell
    CellCurrentBeforeAnswer
    NoLostUpdate
    EndedRunsLeaveNothing
