\* Liveness: under fairness every run submitted ends.  No symmetry: TLC does not check liveness with it.
SPECIFICATION LiveSpec
CONSTANTS
    Runs = {r1, r2}
    r1 = r1
    r2 = r2
    Workers = {w1, w2}
    Accesses = {a1, a2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxJobs = 1
    MaxRestarts = 1
    MaxAccessChanges = 1
    Sequels = FALSE
    GetterWrites = FALSE
    SaveFails = FALSE
    Panics = FALSE
PROPERTY RunsEnd
INVARIANTS
    TypeInv
