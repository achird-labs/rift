\* Under fairness of the engine's own steps, every operation returns. TLC's liveness check is unsound
\* under symmetry, so this cfg has none, and the bounds stay small. Failures stay on: a failing write
\* or unlink must still end its operation.
CONSTANTS
    Ports = {1}
    Creators = {c1, c2}
    Deleters = {d1}
    Appliers = {}
    ApplyOnes = {}
    DeleteAlls = {}
    ApplyDesired = {}
    MaxGens = 3
    MaxReqs = 1
    MaxChanges = 0
    Preloaded = TRUE
    PersistFails = TRUE
    UnlinkFails = TRUE
    DrainTimesOut = FALSE
    NoGen = NoGen
    NoOp = NoOp

SPECIFICATION FairSpec

PROPERTIES
    OpsFinish
