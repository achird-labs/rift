\* The pull-request gate: one port, two creates and one delete racing, two requests per generation.
\* Small enough for TLC in under a minute; the full set of ops is in Lifecycle.cfg.
CONSTANTS
    Ports = {1}
    Creators = {c1, c2}
    Deleters = {d1}
    Appliers = {}
    ApplyOnes = {}
    DeleteAlls = {}
    Writers = {w1}
    ApplyDesired = {}
    MaxGens = 2
    MaxReqs = 2
    MaxChanges = 1
    Preloaded = FALSE
    PersistFails = FALSE
    UnlinkFails = FALSE
    DrainTimesOut = FALSE
    NoGen = NoGen
    NoOp = NoOp

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeInv
    FloorMonotone
    SharedStateBelongsToCurrent
    NoServeAfterDeleteReturns
    RemoveOnlyOwn
    ErrDeleteStillServing
    ErrCreateNotRunning
    OneClaimant
    LoserNeverAnswers
    ApplyReportsTruth
    TableFileAgree
    TableHoldsLive
