\* LifecycleReplace.cfg with failing datadir writes (issue #1800): a replace that loses its port to a
\* create whose write then fails must not leave the replaced imposter's file behind.
CONSTANTS
    Ports = {1}
    Creators = {c1}
    Deleters = {d1}
    Appliers = {}
    ApplyOnes = {r1}
    DeleteAlls = {}
    Writers = {}
    ApplyDesired = {}
    MaxGens = 3
    MaxReqs = 1
    MaxChanges = 1
    Preloaded = TRUE
    PersistFails = TRUE
    UnlinkFails = FALSE
    DrainTimesOut = FALSE
    NoGen = NoGen
    NoOp = NoOp

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    FloorMonotone
    ApplyReportsTruth
    TypeInv
    SharedStateBelongsToCurrent
    NoServeAfterDeleteReturns
    RemoveOnlyOwn
    ErrDeleteStillServing
    ErrCreateNotRunning
    OneClaimant
    TableFileAgree
    TableHoldsLive
