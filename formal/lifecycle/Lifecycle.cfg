\* The full check of creates against deletes, on master and on demand: two creates and two deletes
\* racing on one preloaded port, the datadir write and the unlink each allowed to fail.  Wider
\* sets of ops do not finish in TLC's budget; the apply and replace paths have their own cfgs
\* (LifecycleApply.cfg, LifecycleReplace.cfg).  The drain timeout is a documented limit
\* (witness.py) and stays off here.
CONSTANTS
    Ports = {1}
    Creators = {c1, c2}
    Deleters = {d1, d2}
    Appliers = {}
    ApplyOnes = {}
    DeleteAlls = {}
    ApplyDesired = {}
    MaxGens = 3
    MaxReqs = 1
    MaxChanges = 0
    Preloaded = TRUE
    PersistFails = TRUE
    UnlinkFails = TRUE
    DrainTimesOut = FALSE
    NoGen = NoGen
    NoOp = NoOp

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    FloorMonotone
    RemoveOnlyOwn
    TableFileAgree
    ErrDeleteStillServing
    TypeInv
    SharedStateBelongsToCurrent
    NoServeAfterDeleteReturns
    ErrCreateNotRunning
    OneClaimant
    ApplyReportsTruth
    TableHoldsLive
