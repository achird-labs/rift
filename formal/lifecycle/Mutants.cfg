\* The bounds mutants.py and witness.py start from: one create, two deletes, a preloaded
\* generation, every failure switched off.  Too small for two of the filed findings to reach (they
\* need two creates), so each invariant below holds and a mutant's violation is its own.
\* FloorMonotone is left out: the load-floor race has a one-create form (a request stamped between
\* record_load_floor and the cancel), so the unfixed model violates it here; its mutant in
\* mutants.py runs on the model with the proposed fix applied.
CONSTANTS
    Ports = {1}
    Creators = {c1}
    Deleters = {d1, d2}
    Appliers = {}
    ApplyOnes = {}
    DeleteAlls = {}
    ApplyDesired = {}
    MaxGens = 2
    MaxReqs = 2
    MaxChanges = 1
    Preloaded = TRUE
    PersistFails = FALSE
    UnlinkFails = FALSE
    DrainTimesOut = FALSE
    NoGen = NoGen
    NoOp = NoOp

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeInv
    NoServeAfterDeleteReturns
    RemoveOnlyOwn
    ErrDeleteStillServing
    ErrCreateNotRunning
    LoserNeverAnswers
    OneClaimant
    ApplyReportsTruth
    TableFileAgree
    TableHoldsLive
