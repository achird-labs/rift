\* The bounds mutants.py and witness.py start from: one create, two deletes, a preloaded generation,
\* every failure switched off.  Each invariant below holds here, so a mutant's violation is its own.
CONSTANTS
    Ports = {1}
    Creators = {c1}
    Deleters = {d1, d2}
    Appliers = {}
    ApplyOnes = {}
    DeleteAlls = {}
    ApplyDesired = {}
    MaxGens = 2
    MaxReqs = 2
    MaxChanges = 1
    Preloaded = TRUE
    PersistFails = FALSE
    UnlinkFails = FALSE
    DrainTimesOut = FALSE
    NoGen = NoGen
    NoOp = NoOp

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    TypeInv
    FloorMonotone
    SharedStateBelongsToCurrent
    NoServeAfterDeleteReturns
    RemoveOnlyOwn
    ErrDeleteStillServing
    ErrCreateNotRunning
    LoserNeverAnswers
    OneClaimant
    ApplyReportsTruth
    TableFileAgree
    TableHoldsLive
