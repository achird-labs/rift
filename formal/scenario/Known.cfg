\* The invariants that filed, unfixed defects violate on the PR bounds.  witness.py requires each
\* to be violated here, one at a time; the fix PR of each moves its invariant back to
\* ScenarioPR.cfg and deletes its row from witness.py.  README.md, "Findings", has the issues.
CONSTANTS
    Gated = {g1, g2, g3}
    Pollers = {p1}
    Setters = {s1}
    Resetters = {d1}
    Start = "B"
    SetTo = "B"
    AtomicCas = TRUE
    NoVal = NoVal

SPECIFICATION Spec

SYMMETRY Symmetry

INVARIANTS
    StampMonotone
    NoStaleAnswerAtRest
    NoMatchOnlyWhenUncovered
