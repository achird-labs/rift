\* The two carrier invariants, where they hold: no clear, no restart and no deleteProxy.  A clear or a
\* restart can leave a second carrier or a carrier with no recording, as README.md's limits say.
CONSTANTS
    Requests = {r1, r2}
    Editors = {e1}
    EditKinds = {"move", "delete", "replace"}
    Clearers = {}
    Restarters = {}
    GeneratesStub = TRUE
    SettleCanFail = TRUE
    Preloaded = TRUE
SYMMETRY Symmetry
SPECIFICATION Spec
INVARIANTS
    AtMostOneCarrier
    CarrierHasRecording
