\* The full run: three requests, one edit of every kind, a clear and a restart, a store whose settle
\* can fail.  The invariants are ProxyOncePR.cfg's.  A second edit on top of this passed 13 million
\* generated states in 7 minutes with the queue still growing and was stopped, so two edits are left
\* to ProxyOnceTwoEdits.cfg, with two requests.
CONSTANTS
    Requests = {r1, r2, r3}
    Editors = {e1}
    EditKinds = {"move", "delete", "replace", "deleteProxy", "replaceAll"}
    Clearers = {c1}
    Restarters = {u1}
    GeneratesStub = TRUE
    SettleCanFail = TRUE
    Preloaded = TRUE
SYMMETRY Symmetry
SPECIFICATION Spec
INVARIANTS
    TypeInv
    NoWedgedClaim
    ClaimLifetimeIsStubLifetime
    ShadowedRecordingForwards
    RecordedOnce
    LoserNeverRecords
    ClaimExcludesRecording
