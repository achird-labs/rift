\* The other half of the full run: two requests, two edits of every kind, a clear and a restart, a
\* store whose settle can fail.  The invariants are ProxyOncePR.cfg's.
CONSTANTS
    Requests = {r1, r2}
    Editors = {e1, e2}
    EditKinds = {"move", "delete", "replace", "deleteProxy", "replaceAll"}
    Clearers = {c1}
    Restarters = {u1}
    GeneratesStub = TRUE
    SettleCanFail = TRUE
    Preloaded = TRUE
SYMMETRY Symmetry
SPECIFICATION Spec
INVARIANTS
    TypeInv
    NoWedgedClaim
    ClaimLifetimeIsStubLifetime
    ShadowedRecordingForwards
    RecordedOnce
    LoserNeverRecords
    ClaimExcludesRecording
    OnlyClaimHolderInserts
    ForwardUnrecordedOnlyWhenLost
