\* The PR gate: two requests, one edit, a savedProxyResponses clear and a restart, a store whose
\* settle can fail, starting recorded.  AtMostOneCarrier and CarrierHasRecording fall to a clear or a
\* restart here, by design: ProxyOnceCarriers.cfg holds them, and witness.py keeps those reachable.
CONSTANTS
    Requests = {r1, r2}
    Editors = {e1}
    EditKinds = {"move", "delete", "replace", "deleteProxy", "replaceAll"}
    Clearers = {c1}
    Restarters = {u1}
    GeneratesStub = TRUE
    SettleCanFail = TRUE
    Preloaded = TRUE
SYMMETRY Symmetry
SPECIFICATION Spec
INVARIANTS
    TypeInv
    NoWedgedClaim
    ClaimLifetimeIsStubLifetime
    ShadowedRecordingForwards
    RecordedOnce
    LoserNeverRecords
    ClaimExcludesRecording
    OnlyClaimHolderInserts
    ForgetRemovesWhatItSaw
    RecordingHasItsOwnCarrier
    CarrierMeansRecorded
    ForwardUnrecordedOnlyWhenLost
