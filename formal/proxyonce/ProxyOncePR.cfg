\* The PR gate: two requests, one edit, a savedProxyResponses clear and a restart, a store whose
\* settle can fail, starting recorded.  The invariants violated by filed, unfixed defects are in
\* Known.cfg until those are fixed.
CONSTANTS
    Requests = {r1, r2}
    Editors = {e1}
    EditKinds = {"move", "delete", "replace", "deleteProxy", "replaceAll"}
    Clearers = {c1}
    Restarters = {u1}
    GeneratesStub = TRUE
    SettleCanFail = TRUE
    Preloaded = TRUE
SYMMETRY Symmetry
SPECIFICATION Spec
INVARIANTS
    TypeInv
    NoWedgedClaim
    ClaimLifetimeIsStubLifetime
    ShadowedRecordingForwards
    RecordedOnce
    LoserNeverRecords
    ClaimExcludesRecording
