\* The invariants that filed, unfixed defects violate on the PR bounds.  witness.py requires each
\* to be violated here, one at a time; the fix PR of each moves its invariant back to
\* ProxyOncePR.cfg and deletes its row from witness.py.  README.md, "Findings", has the issues.
CONSTANTS
    Requests = {r1, r2}
    Editors = {e1}
    EditKinds = {"move", "delete", "replace"}
    Clearers = {c1}
    Restarters = {}
    GeneratesStub = TRUE
    SettleCanFail = FALSE
    Preloaded = TRUE
SYMMETRY Symmetry
SPECIFICATION Spec
INVARIANTS
    AtMostOneCarrier
    ForgetRemovesWhatItSaw
    CarrierHasRecording
    CarrierMeansRecorded
