\* The pull-request gate: two requests of every kind, both transports and protocols, stubs added
\* before or after the accept, pipelined or not.
CONSTANTS
    MaxReqs = 2
    Kinds = {"ok", "refuse", "reset", "empty", "random", "malformed"}
    Transports = {"http", "https"}
    ClientVersions = {"h1", "h2"}
    StubTimings = {"before", "after"}
    ClientPipelines = {TRUE, FALSE}
    BodyUnits = 1
    PipelineFlush = FALSE
    ImposterArmsOnH2 = TRUE
    DrainOutrunsDelivery = FALSE

SPECIFICATION Spec

\* H2FaultStaysOnStream (#1782) and RstDiscardsNothing (#1783) are violated by filed defects and live
\* in Known.cfg until their fixes land
\* (README.md, "Findings").
INVARIANTS
    TypeInv
    FaultFiresAtMostOnce
    PayloadAboveTlsOnHttps
    FaultBeforeResponseBytes
    FaultNeverTripsEarlierBytes
    LingerDeliversResponse
