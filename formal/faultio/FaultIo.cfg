\* The full model: three requests and a refused body of two units.
CONSTANTS
    MaxReqs = 3
    Kinds = {"ok", "refuse", "reset", "empty", "random", "malformed"}
    Transports = {"http", "https"}
    ClientVersions = {"h1", "h2"}
    StubTimings = {"before", "after"}
    ClientPipelines = {TRUE, FALSE}
    BodyUnits = 2
    PipelineFlush = FALSE
    ImposterArmsOnH2 = FALSE
    DrainOutrunsDelivery = FALSE

SPECIFICATION Spec

INVARIANTS
    H2FaultStaysOnStream
    TypeInv
    FaultFiresAtMostOnce
    PayloadAboveTlsOnHttps
    FaultBeforeResponseBytes
    FaultNeverTripsEarlierBytes
    LingerDeliversResponse
