<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="One connection through a Rift imposter started with --local-only. A remote client, 203.0.113.7, is accepted and dropped at the peer check. A loopback client, 127.0.0.1, passes the peer check, socket tuning (TCP_NODELAY), FaultIo, the TLS handshake of an https imposter and HTTP/1 or h2, matches a stub, and runs its behaviors in order: wait, lookup, copy, shellTransform, decorate. The response is written back through FaultIo, where a fault armed by the stub would reset or cut the connection.">
<title>One connection through a Rift imposter started with --local-only. A remote client, 203.0.113.7, is accepted and dropped at the peer check. A loopback client, 127.0.0.1, passes the peer check, socket tuning (TCP_NODELAY), FaultIo, the TLS handshake of an https imposter and HTTP/1 or h2, matches a stub, and runs its behaviors in order: wait, lookup, copy, shellTransform, decorate. The response is written back through FaultIo, where a fault armed by the stub would reset or cut the connection.</title>
