94" class="big" text-anchor="middle" fill="#e6e8f5">TLS</text><text x="626" y="214" class="cap" text-anchor="middle">https only</text><text x="626" y="229" class="cap" text-anchor="middle">ALPN h2/http1.1</text><line x1="553" y1="206" x2="566" y2="206" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><rect x="700" y="169" width="116" height="74" rx="6" fill="#6260f9" fill-opacity=".08" stroke="#6260f9" stroke-width="1.4"/><text x="758" y="194" class="big" text-anchor="middle" fill="#e6e8f5">HTTP/1 · h2</text><text x="758" y="214" class="cap" text-anchor="middle">h2c by preface</text><text x="758" y="229" class="cap" text-anchor="middle">on plain http</text><line x1="685" y1="206" x2="698" y2="206" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><rect x="832" y="169" width="116" height="74" rx="6" fill="#6260f9" fill-opacity=".08" stroke="#6260f9" stroke-width="1.4"/><text x="890" y="194" class="big" text-anchor="middle" fill="#e6e8f5">match</text><text x="890" y="214" class="cap" text-anchor="middle">first stub whose</text><text x="890" y="229" class="cap" text-anchor="middle">predicates match</text><line x1="817" y1="206" x2="830" y2="206" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><text x="354" y="296" class="tiny">BEHAVIORS · Mountebank order (an array runs in its own order)</text><rect x="358" y="318" width="92" height="44" rx="6" fill="#53cafd" fill-opacity=".07" stroke="#53cafd" stroke-width="1.4"/><text x="404" y="344" class="lbl" text-anchor="middle">wait</text><rect x="466" y="318" width="92" height="44" rx="6" fill="#53cafd" fill-opacity=".07" stroke="#53cafd" stroke-width="1.4"/><text x="512" y="344" class="lbl" text-anchor="middle">lookup</text><line x1="451" y1="340" x2="464" y2="340" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><rect x="574" y="318" width="92" height="44" rx="6" fill="#53cafd" fill-opacity=".07" stroke="#53cafd" stroke-width="1.4"/><text x="620" y="344" class="lbl" text-anchor="middle">copy</text><line x1="559" y1="340" x2="572" y2="340" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><rect x="692" y="318" width="120" height="44" rx="6" fill="#53cafd" fill-opacity=".07" stroke="#53cafd" stroke-width="1.4"/><text x="752" y="344" class="lbl" text-anchor="middle">shellTransform</text><line x1="667" y1="340" x2="690" y2="340" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><rect x="844" y="318" width="92" height="44" rx="6" fill="#53cafd" fill-opacity=".07" stroke="#53cafd" stroke-width="1.4"/><text x="890" y="344" class="lbl" text-anchor="middle">decorate</text><line x1="813" y1="340" x2="842" y2="340" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><line x1="890" y1="245" x2="890" y2="316" stroke="#5a5f80" stroke-width="1.4" marker-end="url(#tip)" style="color:#5a5f80"/><line x1="890" y1="438" x2="40" y2="438" class="rail"/><line x1="890" y1="438" x2="40" y2="438" class="flow" stroke="#34d399"/><line x1="890" y1="362" x2="890" y2="438" stroke="#5a5f80" stroke-width="1.4"/><text x="500" y="428" class="cap">response written back: HTTP -&gt; TLS -&gt; FaultIo -&gt; socket</text><rect x="488" y="430" width="12" height="16" rx="3" fill="#8e41fd" fill-opacity=".3" stroke="#8e41fd" stroke-width="1.4"/><text x="494" y="462" class="cap" text-anchor="middle" fill="#8e41fd">a fault armed by the matched stub fires here, on the write:</text><text x="494" y="478" class="cap" text-anchor="middle" fill="#8e41fd">reset · empty · random data · malformed chunk</text><rect x="76.9" y="102" width="146.2" height="20" rx="5" fill="#8085a8" fill-opacity=".16" stroke="#8085a8" stroke-width="1.4"/><text x="150" y="115.78" class="chip" text-anchor="middle" fill="#8085a8" style="font-size:10.5px">203.0.113.7 · remote</text><rect x="336.9" y="102" width="146.2" height="20" rx="5" fill="